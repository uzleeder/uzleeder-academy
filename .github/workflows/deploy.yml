# ==========================================================================
# deploy.yml — academy.uzleeder.uz ga Vercel production deploy
# --------------------------------------------------------------------------
# `main` ga push bo'lganda (yoki Actions → Run workflow bilan qo'lda) ishga
# tushadi. Build yo'q — statik fayllar + `api/` funksiyalari + middleware.
#
# Kerakli GitHub Secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — Vercel → Account Settings → Tokens → Create
#   VERCEL_ORG_ID      — `.vercel/project.json` dagi `orgId`
#   VERCEL_PROJECT_ID  — `.vercel/project.json` dagi `projectId`
# (ID'larni mahalliy `vercel link` buyrug'i yoki Vercel → Project →
#  Settings → General dan olish mumkin.)
#
# Sayt sirlari (AUTH_USER, SESSION_SECRET, DATABASE_URL …) bu yerda emas —
# ular Vercel → Settings → Environment Variables da turadi (DEPLOY.md, 3-bo'lim).
# ==========================================================================
name: Deploy (Vercel production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  PROD_DOMAIN: academy.uzleeder.uz

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sirlar bor-yo'qligini tekshirish
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ]      || missing+=("VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ]     || missing+=("VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Yetishmayotgan GitHub Secrets: ${missing[*]} — Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vercel CLI
        run: npm install --global vercel@latest

      - name: Loyiha sozlamalarini olish
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Production deploy
        id: deploy
        run: |
          set -o pipefail
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"

      - name: Domenni loyihaga ulash (academy.uzleeder.uz)
        id: domain
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          # Team akkauntida so'rovlarga teamId kerak, shaxsiy akkauntda — yo'q
          q=""
          case "$VERCEL_ORG_ID" in team_*) q="?teamId=$VERCEL_ORG_ID" ;; esac

          add="$(curl -sS -X POST \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/domains$q" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"$PROD_DOMAIN\"}")"
          code="$(printf '%s' "$add" | jq -r '.error.code // "ok"')"
          case "$code" in
            ok)                 echo "$PROD_DOMAIN loyihaga qo'shildi." ;;
            domain_already_in_use|conflict|*already*) echo "$PROD_DOMAIN allaqachon ulangan." ;;
            *) echo "::warning::Domenni ulash javobi: $add" ;;
          esac

          info="$(curl -sS \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains/$PROD_DOMAIN$q" \
            -H "Authorization: Bearer $VERCEL_TOKEN")"
          if [ "$(printf '%s' "$info" | jq -r '.verified // false')" = "true" ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "DNS tasdiqlangan ✅"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$PROD_DOMAIN hali tasdiqlanmagan — DNS yozuvini qo'shish kerak (quyida)."
            printf '%s' "$info" | jq -r '.verification // [] | .[] | "  \(.type)  \(.domain)  →  \(.value)"'
            echo "  Oddiy variant: CNAME  academy.uzleeder.uz  →  cname.vercel-dns.com"
          fi

      - name: Tekshirish (/api/health)
        continue-on-error: true
        run: |
          probe() {
            for i in 1 2 3 4 5; do
              body="$(curl -sS --max-time 20 "$1/api/health" || true)"
              [ -n "$body" ] && { echo "$body"; return 0; }
              sleep 5
            done
            return 1
          }
          echo "### Deploy natijasi" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          if body="$(probe "${{ steps.deploy.outputs.url }}")"; then
            echo "/api/health → $body"
            echo "- \`/api/health\`: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "$(printf '%s' "$body" | jq -r '.ok // false')" != "true" ]; then
              echo "::warning::/api/health ok:false — Vercel → Settings → Environment Variables to'liq emas (DEPLOY.md, 3-bo'lim)."
            fi
          else
            echo "::warning::/api/health javob bermadi."
          fi
          if [ "${{ steps.domain.outputs.verified }}" = "true" ]; then
            echo "- Domen: https://$PROD_DOMAIN ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Domen: $PROD_DOMAIN — DNS tasdiqlanishi kutilmoqda (log'ga qarang)" >> "$GITHUB_STEP_SUMMARY"
          fi
