<!-- Nazoratchi paneli — ilovaning CSS'i va O'QISH uchun modullari (Store, HabitPlan, Goal,
     Mastery, DataCamp …) yuklanadi; o'quvchi holati /api/ctrl/state dan (faqat o'qish).
     Panel hech narsani localStorage'ga yozmaydi va o'quvchi progressini o'zgartirmaydi. -->

<link rel="stylesheet" href="css/components.css?v=2026092601">
<link rel="stylesheet" href="css/pages.css?v=2026092601">
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 560px at 85% -10%,var(--bg-tint-1),transparent 68%),radial-gradient(700px 460px at -8% 10%,var(--bg-tint-2),transparent 62%)}
[hidden]{display:none!important}
/* ---- login ---- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow-2)}
.box .mark{width:44px;height:44px;border-radius:11px;background:#1c2233;display:grid;place-items:center;margin-bottom:14px}.box .mark svg{width:24px;height:24px}
.box h1{font-family:var(--font-display);font-size:22px;margin:0 0 4px}.box p{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 14px}
.box label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.box input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit}.box input:focus{outline:2px solid var(--brand);outline-offset:1px}
.err{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45;background:color-mix(in srgb,var(--red) 12%,transparent);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);color:var(--red)}.err.show{display:block}
/* ---- shell ---- */
.ct-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px)}
.ct-top .mark{width:36px;height:36px;border-radius:9px;background:#1c2233;display:grid;place-items:center}.ct-top .mark svg{width:20px;height:20px}
.ct-top .t b{display:block;font-family:var(--font-display);font-size:15px}.ct-top .t small{color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font:700 11.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.pill.on{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}.pill.on i{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.ct-shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 57px)}
.ct-nav{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
.ct-nav .lbl{font:800 10.5px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.ct-nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink-soft);font:600 13.5px var(--font-body);text-align:left;cursor:pointer}
.ct-nav button svg{width:16px;height:16px;color:var(--muted)}.ct-nav button:hover{background:var(--surface-2)}.ct-nav button.on{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--ink)}.ct-nav button.on svg{color:var(--brand)}
.ct-nav .badge{margin-left:auto;font:700 11px var(--font-mono);padding:2px 7px;border-radius:99px;background:var(--surface-3);color:var(--muted)}.ct-nav .badge.hot{background:var(--red);color:#fff}
.ct-main{padding:22px 26px;max-width:1240px;width:100%}
.ct-main h1{font-family:var(--font-display);font-size:26px;margin:0 0 4px;letter-spacing:-.01em}.ct-main .lede{color:var(--muted);margin:0 0 18px;font-size:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13.5px}.kv span{color:var(--muted)}.kv b{font-weight:600}
.state{display:inline-block;padding:3px 10px;border-radius:999px;font:700 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.state.idle,.state.finished{background:var(--surface-3);color:var(--muted)}.state.waiting{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}.state.active{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}.state.paused{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.log{display:grid;gap:4px;max-height:260px;overflow:auto;font-size:13px}.log div{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-soft)}.log time{font:600 11.5px var(--font-mono);color:var(--muted);min-width:44px}.log code{font:12px var(--font-mono);color:var(--brand-hi)}
.hist{display:grid;gap:6px}.hist div{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:var(--surface-2)}.hist small{color:var(--muted);font:12px var(--font-mono)}
.chat{display:flex;flex-direction:column;height:560px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.m{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:4px}.m.them{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.m time{display:block;font:10.5px var(--font-mono);opacity:.7;margin-top:4px}.m.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px}
.send{display:flex;gap:8px;margin-top:10px}.send textarea{flex:1;resize:none;min-height:44px;max-height:120px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit}
textarea.notes{width:100%;min-height:160px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:13.5px/1.5 var(--font-body);resize:vertical}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.strip{display:flex;gap:4px;flex-wrap:wrap}.strip i{width:22px;height:22px;border-radius:6px;background:var(--surface-3);display:grid;place-items:center;font:700 9px var(--font-mono);color:var(--muted)}.strip i.ok{background:var(--green);color:#fff}.strip i.miss{background:var(--red);color:#fff}.strip i.today{outline:2px solid var(--brand)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font:700 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}.tbl td.mono{font-family:var(--font-mono);font-size:12px}
.tbl tr.done td:first-child{color:var(--green)}
.hb-row{cursor:default}.hb-check{pointer-events:none}
.ro{font:700 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);padding:3px 9px;border-radius:99px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.mcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}.mcard .th{aspect-ratio:16/9;background:#0d0d12;display:grid;place-items:center;color:var(--muted)}.mcard img{width:100%;height:100%;object-fit:cover;display:block}.mcard .b{padding:8px 10px;font-size:12.5px}.mcard .b b{display:block;font-size:13px}
@media(max-width:940px){.ct-shell{grid-template-columns:1fr}.ct-nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.ct-nav .lbl{display:none}.ct-nav button{width:auto}.two,.three{grid-template-columns:1fr}.chat{height:440px}}
/* ---- xodim paneli: vaqt chizig'i, formalar, tekshiruv ---- */
.tl{display:grid;gap:2px}.tl-row{display:grid;grid-template-columns:56px 130px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px}.tl-row time{font:600 11.5px var(--font-mono);color:var(--muted)}.tl-k{font:700 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--brand-hi)}.tl-row code{font:11.5px var(--font-mono);color:var(--muted)}.tl-row.k-mistake .tl-k{color:var(--red)}.tl-row.k-session .tl-k{color:var(--gold)}
.af{display:grid;gap:10px}.af .field{display:grid;gap:4px}.af .field span{font-size:12px;color:var(--muted);font-weight:600}.af .input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:13.5px}.af-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rv-card summary{display:flex;flex-wrap:wrap;align-items:center;gap:10px;cursor:pointer;font-size:14px}.rv-card summary small{color:var(--muted);font:12px var(--font-mono);margin-left:auto}.rv-text{white-space:pre-wrap;font:13.5px/1.6 var(--font-body);background:var(--surface-2);padding:12px;border-radius:10px;margin:8px 0 12px}.h2s{font-family:var(--font-display);font-size:17px;margin:18px 0 10px}
.ct-main .card{margin-bottom:16px}
@media(max-width:700px){.two,.three{grid-template-columns:1fr}.tl-row{grid-template-columns:52px 1fr;grid-auto-rows:auto}.tl-row code{display:none}.tbl{display:block;overflow:auto}.kv{grid-template-columns:1fr}.chat{height:70vh}.ct-main{padding:14px}.ct-top{flex-wrap:wrap;gap:8px}.ro{display:none}.as-row{grid-template-columns:1fr}.as-side{flex-direction:row;flex-wrap:wrap}}
</style>
</head>

<!-- Kirish YO'Q — yagona login sahifasi /login. Sessiya bo'lmasa u yerga qaytariladi. -->
<div class="gate" id="gate" aria-live="polite">
  <div class="box"><span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18 L9 8 L13 14 L20 5" stroke="var(--brand)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="5" r="2.3" fill="var(--brand)"/></svg></span>
    <h1>UzLeeder Academy</h1><p id="gateMsg" data-t="gateMsg">Sessiya tekshirilmoqda…</p>
    <a class="btn btn-primary" href="/login?next=%2Fcontroller" style="display:inline-flex" data-t="lGo">Kirish</a>
  </div>
</div>

<!-- ============ PANEL ============ -->
<div id="panel" hidden>
  <header class="ct-top">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18 L9 8 L13 14 L20 5" stroke="var(--brand)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="5" r="2.3" fill="var(--brand)"/></svg></span>
    <span class="t"><b>Uz<i style="font-style:normal;color:var(--brand)">Leeder</i></b><small data-t="hTag">Controller · Invigilator</small></span>
    <span class="sp"></span>
    <span class="pill" id="pLearner"><i></i><span data-t="learner">O'quvchi</span>: <span id="pLearnerT">—</span></span>
    <span class="pill" id="pPoll"><i></i><span id="pPollT">sync</span></span>
    <span class="ro" data-t="ro">faqat o'qish</span>
    <div class="segmented"><button type="button" data-lang="uz">UZ</button><button type="button" data-lang="en">EN</button></div>
    <button class="btn btn-ghost btn-sm" id="logout" data-t="logout">Chiqish</button>
  </header>
  <div class="ct-shell">
    <nav class="ct-nav" id="ctNav"></nav>
    <main class="ct-main" id="ctMain"></main>
  </div>
</div>
