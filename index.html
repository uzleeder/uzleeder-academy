/* ====================== INTRO (kirish oynasi) ====================== */
#intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg,#07090d);color:var(--text,var(--ink,#f2f4f8));transition:opacity .45s ease,visibility .45s;overflow:hidden}
#intro.out{opacity:0;visibility:hidden;pointer-events:none}
#intro::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 460px at 50% 40%,color-mix(in srgb,var(--brand,#f0384e) 16%,transparent),transparent 70%)}
.in-box{position:relative;display:grid;justify-items:center;gap:14px;text-align:center;animation:inUp .7s cubic-bezier(.2,.8,.2,1) both}
/* Brend "app icon": yumaloq ink plita, akademiya belgisi qizilda */
.in-mark{width:86px;height:86px;border-radius:22px;background:#1c2233;display:grid;place-items:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.in-mark svg{width:48px;height:48px}.in-mark svg path{stroke:var(--brand,#f0384e)}.in-mark svg circle{fill:var(--brand,#f0384e)}
.in-name{font-family:Outfit,Manrope,system-ui,sans-serif;font-weight:800;font-size:38px;letter-spacing:-.02em;line-height:1;margin-top:6px}
.in-name i{font-style:normal;color:var(--brand,#f0384e)}
.in-acad{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;font-weight:700;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted,#9098a8);padding-left:.42em}
.in-bar{width:220px;height:3px;border-radius:99px;background:color-mix(in srgb,var(--text,var(--ink,#fff)) 12%,transparent);overflow:hidden;margin-top:22px}
.in-bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--brand,#f0384e);transition:width .18s ease-out}
.in-pct{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;font-size:12px;color:var(--muted,#9098a8);letter-spacing:.08em;min-height:16px}
.in-by{position:absolute;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));text-align:center;font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--text,var(--ink,#f2f4f8));opacity:.75}
.in-by b{color:var(--brand,#f0384e)}
@keyframes inUp{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.in-box{animation:none}#intro{transition:none}}
html.intro-on{overflow:hidden}</style>
</head>

<div id="intro" role="status" aria-live="polite" aria-label="UzLeeder Academy">
  <div class="in-box">
    <span class="in-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18 L9 8 L13 14 L20 5" stroke="#f0384e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="5" r="2.3" fill="#f0384e"/></svg></span>
    <div class="in-name">Uz<i>Leeder</i></div>
    <div class="in-acad">Academy</div>
    <div class="in-bar"><i id="inBar"></i></div>
    <div class="in-pct" id="inPct">0%</div>
  </div>
  <div class="in-by">by <b>UzLeeder</b></div>
</div>
<script>
(function(){var el=document.getElementById('intro'),bar=document.getElementById('inBar'),pct=document.getElementById('inPct');if(!el)return;
/* Foiz REAL yuklanishni ko'rsatadi: skriptlar soni (har <script src> yuklanishi = qadam),
   90% — hammasi yuklandi, 100% — App.render tugadi (UZ_APP_READY). Soxta kutish yo'q,
   faqat 600 ms minimal ko'rinish (miltillamasin). Skript xato bersa ham qadam sanaladi. */
var t0=Date.now(),p=0,done=false,total=0,got=0,ready=false;
document.addEventListener('load',function(e){if(e.target&&e.target.tagName==='SCRIPT'&&e.target.src){got++;}},true);
document.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'&&e.target.src){got++;}},true);
window.addEventListener('load',function(){ready=true});
window.UZ_APP_READY=function(){ready=true;got=total||1};
function paint(v){if(v<=p)return;p=v;bar.style.width=v+'%';pct.textContent=Math.round(v)+'%'}
function tick(){if(done)return;if(!total)total=document.querySelectorAll('script[src]').length||1;var e=Date.now()-t0;var target=Math.min(90,got/total*90);if(ready)target=100;if(e>8000)target=100;if(e<600)target=Math.min(target,e/600*90);paint(target);if(p>=100){done=true;clearInterval(iv);setTimeout(function(){el.classList.add('out');document.documentElement.classList.remove('intro-on');setTimeout(function(){el.remove()},500)},180);return}}
document.documentElement.classList.add('intro-on');var iv=setInterval(tick,40);
window.UZ_INTRO_DONE=function(cb){if(done)cb();else{var i=setInterval(function(){if(done){clearInterval(i);cb()}},60)}};
})();</script>
